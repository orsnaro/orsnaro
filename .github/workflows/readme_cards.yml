name: README cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main, chore/private-profile-cards]
    paths: [.github/workflows/readme_cards.yml]

permissions:
  contents: write

concurrency:
  group: readme-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate private stats access
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [[ -z "$METRICS_TOKEN" ]]; then
            echo "::error::METRICS_TOKEN is missing; no public-only fallback will be generated."
            exit 1
          fi
          curl --fail --silent --show-error \
            --dump-header "$RUNNER_TEMP/readme-token.headers" \
            --output "$RUNNER_TEMP/readme-user.json" \
            -H "Authorization: Bearer $METRICS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user
          scopes=$(awk -F': ' 'tolower($1) == "x-oauth-scopes" {gsub(/\r/, "", $2); print $2}' "$RUNNER_TEMP/readme-token.headers" | tr -d '[:space:]')
          if ! grep -Eq '(^|,)repo(,|$)' <<< "$scopes" || ! grep -Eq '(^|,)(read:user|user)(,|$)' <<< "$scopes"; then
            echo "::error::METRICS_TOKEN needs a classic PAT with repo and read:user scopes for private stats."
            exit 1
          fi
          if ! jq -e '.login | ascii_downcase == "orsnaro"' "$RUNNER_TEMP/readme-user.json" > /dev/null; then
            echo "::error::METRICS_TOKEN must belong to orsnaro."
            exit 1
          fi

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=orsnaro&theme=github_dark&hide=Jupyter%20Notebook,HTML,CSS,JavaScript,TeX,Java,SVG,Text,CSV,ShaderLab,QML,Shell,Batchfile&layout=donut&hide_border=true&langs_count=6&exclude_repo=orsnaro,PC-metrics&disable_animations=true
          path: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}
          core_version: 2.2.1
          fail_on_error: "true"

      - name: Generate streak
        uses: DenverCoder1/github-readme-streak-stats@d855de1a23fe45bdda5ffbc28a6d4b80b0f107e1 # v1
        with:
          options: user=orsnaro&theme=transparent&hide_border=true&ring=58a6ff&fire=58a6ff&currStreakLabel=58a6ff&sideLabels=adbac7&dates=adbac7&currStreakNum=adbac7&sideNums=adbac7&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Generate stats
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=orsnaro&show_icons=true&theme=ocean_dark&include_all_commits=true&disable_animations=true
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          core_version: 2.2.1
          fail_on_error: "true"

      # Runs only after every card succeeds; failed refreshes retain the last good SVGs.
      - name: Commit cards
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          perl -0777 -pi -e 's/[ \t]+$//mg; s/\n+\z/\n/' profile/top-langs.svg profile/streak.svg profile/stats.svg
          git add -- profile/top-langs.svg profile/streak.svg profile/stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update README cards [skip ci]"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
