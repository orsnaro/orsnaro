name: README cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main, chore/private-profile-cards]
    paths: [.github/workflows/readme_cards.yml]

permissions:
  contents: write

concurrency:
  group: readme-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read contribution policy
        id: policy
        run: bash .github/scripts/profile-policy.sh

      - name: Validate private stats access
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [[ -z "$METRICS_TOKEN" ]]; then
            echo "::error::METRICS_TOKEN is missing; no public-only fallback will be generated."
            exit 1
          fi
          curl --fail --silent --show-error \
            --dump-header "$RUNNER_TEMP/readme-token.headers" \
            --output "$RUNNER_TEMP/readme-user.json" \
            -H "Authorization: Bearer $METRICS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user
          scopes=$(awk -F': ' 'tolower($1) == "x-oauth-scopes" {gsub(/\r/, "", $2); print $2}' "$RUNNER_TEMP/readme-token.headers" | tr -d '[:space:]')
          if ! grep -Eq '(^|,)repo(,|$)' <<< "$scopes" || ! grep -Eq '(^|,)(read:user|user)(,|$)' <<< "$scopes"; then
            echo "::error::METRICS_TOKEN needs a classic PAT with repo and read:user scopes for private stats."
            exit 1
          fi
          if ! jq -e '.login | ascii_downcase == "orsnaro"' "$RUNNER_TEMP/readme-user.json" > /dev/null; then
            echo "::error::METRICS_TOKEN must belong to orsnaro."
            exit 1
          fi

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=orsnaro&theme=github_dark&hide=Jupyter%20Notebook,HTML,CSS,JavaScript,TeX,Java,SVG,Text,CSV,ShaderLab,QML,Shell,Batchfile&layout=donut&hide_border=true&langs_count=6&exclude_repo=orsnaro,PC-metrics&disable_animations=true
          path: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}
          core_version: 2.2.1
          fail_on_error: "true"

      - name: Prepare pinned streak renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DenverCoder1/github-readme-streak-stats
          ref: d855de1a23fe45bdda5ffbc28a6d4b80b0f107e1
          path: .profile-tools/streak-renderer
          persist-credentials: false

      - name: Prepare streak PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: intl, curl, dom
          coverage: none

      - name: Validate streak runtime
        run: |
          php -r 'if (PHP_VERSION_ID < 80300 || PHP_VERSION_ID >= 80400) { exit(1); } foreach (["intl", "curl", "dom"] as $extension) { if (!extension_loaded($extension)) { exit(1); } }'
          php -l .github/scripts/filtered-streak.php
          php -l .profile-tools/streak-renderer/src/stats.php
          php -l .profile-tools/streak-renderer/src/card.php

      - name: Generate streak
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          PROFILE_STATS_POLICY: ${{ github.workspace }}/.github/profile-stats.json
          STREAK_RENDERER_PATH: ${{ github.workspace }}/.profile-tools/streak-renderer
          STREAK_PATH: ${{ github.workspace }}/profile/streak.svg
          STREAK_OPTIONS: user=orsnaro&theme=transparent&hide_border=true&ring=58a6ff&fire=58a6ff&currStreakLabel=58a6ff&sideLabels=adbac7&dates=adbac7&currStreakNum=adbac7&sideNums=adbac7&disable_animations=true
        run: php .github/scripts/filtered-streak.php

      # exclude_repo only filters stars; filter commit searches before the core computes rank.
      - name: Generate stats with repository exclusions
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          STATS_PATH: ${{ github.workspace }}/profile/stats.svg
          EXCLUDED_REPOSITORIES: ${{ steps.policy.outputs.repositories }}
          EXCLUDED_REPOSITORY_NAMES: ${{ steps.policy.outputs.repository_names }}
        run: |
          npm install --prefix "$RUNNER_TEMP/readme-stats" --ignore-scripts --no-save --no-audit --no-fund @stats-organization/github-readme-stats-core@2.2.1 axios@1.18.1
          cd "$RUNNER_TEMP/readme-stats"
          node --input-type=module <<'JS'
          import axios from 'axios';
          import { api } from '@stats-organization/github-readme-stats-core';
          import { writeFile } from 'node:fs/promises';

          const exclusions = process.env.EXCLUDED_REPOSITORIES.split(',').map(repository => `-repo:${repository}`);
          let filteredSearch = false;
          axios.interceptors.request.use(config => {
            const url = new URL(config.url, config.baseURL);
            if (url.origin === 'https://api.github.com' && url.pathname === '/search/commits') {
              const query = url.searchParams.get('q');
              if (!query) throw new Error('Missing GitHub commit search query');
              const tokens = query.split(/\s+/);
              const missingExclusions = exclusions.filter(exclusion => !tokens.includes(exclusion));
              url.searchParams.set('q', missingExclusions.length ? `${query} ${missingExclusions.join(' ')}` : query);
              config.url = url.href;
              filteredSearch = true;
            }
            return config;
          });
          axios.interceptors.response.use(response => {
            const url = new URL(response.config.url, response.config.baseURL);
            if (url.origin === 'https://api.github.com' && url.pathname === '/search/commits') {
              const { total_count, incomplete_results } = response.data;
              if (incomplete_results !== false || !Number.isSafeInteger(total_count) || total_count < 0) {
                throw new Error('GitHub commit search is incomplete or invalid');
              }
            }
            return response;
          });
          const result = await api({
            username: 'orsnaro', show_icons: 'true', theme: 'ocean_dark',
            include_all_commits: 'true', disable_animations: 'true', exclude_repo: process.env.EXCLUDED_REPOSITORY_NAMES,
          }, process.env.METRICS_TOKEN);
          if (result.status !== 'success' || !filteredSearch) throw new Error('Filtered stats generation failed');
          await writeFile(process.env.STATS_PATH, result.content);
          JS

      # Runs only after every card succeeds; failed refreshes retain the last good SVGs.
      - name: Commit cards
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          perl -0777 -pi -e 's/[ \t]+$//mg; s/\n+\z/\n/' profile/top-langs.svg profile/streak.svg profile/stats.svg
          git add -- profile/top-langs.svg profile/streak.svg profile/stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update README cards [skip ci]"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
